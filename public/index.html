<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Video Studio</title>
<style>
:root{font-family:Inter,"Microsoft YaHei",Arial,sans-serif;color:#e8edf5;background:#0c1220}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1000px;margin:36px auto;padding:0 20px}.hero{padding:28px;border:1px solid #273449;border-radius:20px;background:linear-gradient(130deg,#17253b,#111827)}h1{margin:0 0 8px;font-size:30px}.muted{color:#9aabc2}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px}.panel{padding:22px;border:1px solid #273449;border-radius:16px;background:#121c2d}label{display:block;margin:12px 0 6px;color:#b8c7da}input,select{width:100%;padding:12px;border-radius:9px;border:1px solid #34445d;background:#0d1726;color:#fff}button{margin-top:16px;padding:12px 18px;border:0;border-radius:9px;background:#4f8cff;color:white;font-weight:700;cursor:pointer}button:disabled{opacity:.5}pre{white-space:pre-wrap;overflow-wrap:anywhere;color:#b8d5ff}.status{padding:12px;background:#0d1726;border-radius:9px;margin-top:14px}.wide{grid-column:1/-1}@media(max-width:720px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}}
</style></head><body><main class="wrap"><section class="hero"><h1>🎬 AI Video Studio</h1><div class="muted">本地优先 · 素材上传 · 自动剪辑 · 配音导入 · MP4 导出</div><p class="muted">文件保存在本机 video-data 文件夹，不会自动上传到云端。</p></section>
<div class="grid"><section class="panel"><h2>1. 上传素材</h2><p class="muted">支持图片、视频和音频。可一次选择多个文件。</p><input id="files" type="file" multiple accept="image/*,video/*,audio/*"><button id="upload">上传到本机</button><div class="status" id="assets">尚未上传素材</div></section>
<section class="panel"><h2>2. 自动剪辑</h2><label>视频标题</label><input id="title" value="我的 AI 视频"><label>每张图片展示秒数</label><input id="seconds" type="number" min="1" max="20" value="4"><label>配音 / 音频（可选）</label><select id="voice"><option value="">不添加</option></select><label>背景音乐（可选）</label><select id="music"><option value="">不添加</option></select><button id="render" disabled>开始合成 MP4</button><div class="status" id="job">等待上传素材</div></section>
<section class="panel wide"><h2>3. Remotion 标题片测试</h2><label>主标题</label><input id="rt" value="Hello, Video Studio"><label>副标题</label><input id="rs" value="Created locally with Remotion"><button id="remotion">渲染 5 秒标题片</button><div id="remotionResult" class="status">可独立测试 Remotion 渲染链路</div></section>
</div></main><script>
let assets=[];
const $=id=>document.getElementById(id);
function addAssets(list){for(const f of list){assets.push(f);const o=document.createElement("option");o.value=f.id;o.textContent=f.originalName+" ("+f.kind+")";if(f.kind==="audio"){$("voice").append(o.cloneNode(true));$("music").append(o.cloneNode(true));}}$("assets").textContent=assets.map(a=>a.originalName+" · "+a.kind).join("\\n");$("render").disabled=!assets.some(a=>a.kind!=="audio");}
$("upload").onclick=async()=>{const files=$("files").files;if(!files.length)return alert("请先选择文件");const fd=new FormData();for(const f of files)fd.append("files",f);$("upload").disabled=true;try{const r=await fetch("/api/uploads",{method:"POST",body:fd});const j=await r.json();if(!r.ok)throw Error(j.error);addAssets(j.files);$("job").textContent="上传成功。选择要使用的素材后即可合成。";}catch(e){alert(e.message)}finally{$("upload").disabled=false}};
$("render").onclick=async()=>{const selected=assets.filter(a=>a.kind!=="audio");const voice=$("voice").value;const music=$("music").value;const r=await fetch("/api/jobs/auto-edit",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({assetIds:selected.map(a=>a.id),voiceoverId:voice||null,musicId:music||null,title:$("title").value,secondsPerImage:Number($("seconds").value)})});const j=await r.json();if(!r.ok)return alert(j.error);$("job").textContent="任务已创建："+j.id;const timer=setInterval(async()=>{const q=await fetch("/api/jobs/"+j.id);const s=await q.json();$("job").textContent=s.status+" · "+s.progress+"% · "+s.message;if(s.status==="completed"){clearInterval(timer);$("job").innerHTML+="<br><a style='color:#8db7ff' href='/api/jobs/"+j.id+"/output'>下载 MP4</a>"}if(s.status==="failed"){clearInterval(timer);$("job").textContent=s.error}},1500)};
$("remotion").onclick=async()=>{const r=await fetch("/api/render/remotion",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({title:$("rt").value,subtitle:$("rs").value})});const j=await r.json();$("remotionResult").textContent=r.ok?"渲染完成："+j.filename+" · "+j.download_url:(j.detail||j.error)};
</script></body></html>
